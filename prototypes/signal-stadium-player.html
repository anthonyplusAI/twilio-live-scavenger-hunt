<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b19">
  <title>Signal Stadium — Player</title>
  <style>
    :root{color-scheme:dark;--ink:#070b19;--panel:#10182b;--edge:#31405a;--paper:#f4f6fb;--muted:#a9b5c9;--red:#ef223a;--blue:#8ab8ff}
    *{box-sizing:border-box} html,body{height:100%;margin:0;overflow:hidden} body{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--paper);background:var(--ink);-webkit-font-smoothing:antialiased}
    button,input,select{font:inherit} button{cursor:pointer} a{color:inherit;text-decoration:none}
    .app{height:100dvh;min-height:0;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr) auto;position:relative;isolation:isolate;background:radial-gradient(ellipse 78% 42% at 50% 37%,#451324 0%,#12152a 48%,#070b19 100%)}
    .app:before{content:"";position:absolute;inset:0;z-index:-2;opacity:.3;background-image:linear-gradient(#45516b2b 1px,transparent 1px),linear-gradient(90deg,#45516b2b 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(transparent,black 35%,transparent 85%)}
    .app:after{content:"";position:absolute;z-index:-1;width:78vmin;aspect-ratio:1;left:50%;top:20%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#fa30452a 0%,#fa30450a 43%,transparent 70%);filter:blur(18px);pointer-events:none}
    .top,.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px max(20px,env(safe-area-inset-right));position:relative;z-index:3}.bottom{white-space:nowrap}
    .top{border-bottom:1px solid #ffffff14}.bottom{border-top:1px solid #ffffff14;padding-bottom:max(16px,env(safe-area-inset-bottom));font-size:10px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase}
    .brand{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:800;letter-spacing:.15em}.brand img{width:24px;height:24px;flex:none;object-fit:contain;border-radius:5px}.event-label{font-size:10px;font-weight:700;letter-spacing:.13em;color:var(--muted);text-transform:uppercase;text-align:right}.bottom a{color:#e1eaff}
    main{min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:12px 18px}.screen{width:min(100%,460px);height:100%;min-height:0;display:flex;flex-direction:column;justify-content:center;position:relative;animation:appear .42s both}
    @keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .eyebrow{font-size:11px;color:#ff8895;letter-spacing:.2em;text-transform:uppercase;font-weight:800;margin:0 0 14px}.hero{font-size:clamp(46px,12vw,76px);line-height:.93;letter-spacing:-.065em;font-weight:900;margin:0;text-wrap:balance}.hero em{font-style:normal;color:var(--red)}.sub{font-size:clamp(14px,3.5vw,17px);line-height:1.45;color:#c9d2e1;max-width:34ch;margin:20px 0 0}
    .primary,.secondary{width:100%;min-height:54px;border-radius:11px;border:0;padding:13px 18px;font-weight:800;letter-spacing:.03em;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:transform .16s,background .16s,box-shadow .16s}.primary{background:var(--red);color:white;box-shadow:0 14px 34px #ef223a40}.primary:hover{background:#ff4056;transform:translateY(-2px)}.primary:active,.secondary:active{transform:scale(.985)}.secondary{background:#eef3ff0e;color:#eff4ff;border:1px solid #ffffff35}.secondary:hover{background:#eef3ff1e}.primary:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}.actions{display:grid;gap:10px;margin-top:auto;padding-top:18px}
    .signal{width:min(80vw,330px);height:min(39vh,300px);margin:10px auto 20px;position:relative;display:grid;place-items:center;filter:drop-shadow(0 22px 35px #0009)}.signal:before,.signal:after{content:"";position:absolute;border:1px solid #f9a3ac6b;border-radius:50%;inset:10%;transform:rotateX(68deg) rotate(-25deg);box-shadow:0 0 45px #ef223a30}.signal:after{inset:0;transform:rotateY(70deg) rotate(25deg);border-color:#8aa9f079}.core{width:45%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 32% 26%,#ffe2e5 0%,#fa5b6d 18%,#a70e2b 42%,#270919 70%,#080b18 100%);border:2px solid #ff8d9d;box-shadow:inset -18px -22px 45px #000a,0 0 45px #ef223a90,0 0 120px #ef223a60;position:relative;animation:pulse 3s ease-in-out infinite}.core:after{content:"";position:absolute;inset:12%;border-radius:50%;border:1px solid #fff9;filter:blur(1px)}@keyframes pulse{50%{transform:scale(1.055);box-shadow:inset -18px -22px 45px #000a,0 0 58px #ef223abb,0 0 130px #ef223a70}}
    .caption{font-size:11px;line-height:1.35;color:var(--muted);margin:10px 0 0}.card{background:linear-gradient(135deg,#18223aef,#0f1729ed);border:1px solid #ffffff2c;border-radius:16px;box-shadow:0 22px 60px #0007;min-height:0}.cardpad{padding:20px}.section-title{font-size:clamp(30px,8vw,46px);letter-spacing:-.05em;line-height:1.02;margin:0 0 12px;font-weight:850}.body{font-size:14px;line-height:1.4;color:#cbd4e3;margin:0 0 18px}.field{display:grid;gap:7px;margin:0 0 12px}.field label{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#b9c6db}.field input,.field select{background:#080e1c;border:1px solid #53617a;border-radius:9px;min-height:46px;padding:10px 12px;color:white;outline:none;width:100%}.field input:focus,.field select:focus{border-color:#ff9aa6;box-shadow:0 0 0 3px #ef223a34}.check{display:flex;gap:11px;align-items:flex-start;color:#dbe3f1;font-size:13px;line-height:1.35;margin:12px 0}.check input{width:18px;height:18px;accent-color:var(--red);flex:none;margin-top:1px}.error{color:#ffb2bb;font-size:12px;min-height:17px;margin:4px 0}
    .preview{height:clamp(190px,38vh,330px);border:1px solid #ffffff46;border-radius:15px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#525f82 0%,#212d49 38%,#091120 100%)}.preview video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.preview .ghost{position:absolute;left:50%;bottom:-20%;transform:translateX(-50%);width:60%;height:70%;border-radius:44% 44% 10% 10%;background:linear-gradient(140deg,#828ea9,#24304a 42%,#101828);box-shadow:0 -80px 0 -26px #b1bdd0}.preview .frame{position:absolute;inset:11px;border:1px solid #ffffff78;border-radius:8px;pointer-events:none}.preview .frame:after{content:"CAMERA PREVIEW";position:absolute;left:9px;top:8px;color:white;font-size:9px;letter-spacing:.16em;font-weight:800;text-shadow:0 1px 8px #000}.preview .slot{position:absolute;right:11px;bottom:11px;font-size:11px;font-weight:800;letter-spacing:.13em;background:#070b19d9;border:1px solid #fff6;border-radius:5px;padding:6px 8px}
    .status{display:inline-flex;align-items:center;gap:9px;align-self:flex-start;border:1px solid #ffffff40;padding:8px 10px;border-radius:99px;background:#ffffff0b;font-size:11px;font-weight:800;letter-spacing:.11em}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red)}.result-mark{font-size:clamp(86px,26vw,150px);line-height:.9;font-weight:900;color:var(--red);letter-spacing:-.12em;filter:drop-shadow(0 0 30px #ef223a66)}
    .stack{display:grid;gap:8px;margin-top:18px}.stack-row{display:flex;align-items:center;gap:12px;background:#ffffff0c;border:1px solid #ffffff25;border-radius:10px;padding:11px 12px}.stack-row b{min-width:94px;font-size:13px}.stack-row span{font-size:12px;line-height:1.3;color:#becbe0}.stack-dot{width:22px;height:22px;border-radius:50%;background:var(--red);box-shadow:0 0 14px #ef223a66;flex:none}.lead-card{width:100%;max-height:100%;overflow:hidden}.lead-heading{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.lead-heading .eyebrow{min-width:0}.lead-step-count{color:#a9b5c9;font-size:11px;letter-spacing:.12em;font-weight:800;white-space:nowrap}.lead-fields-layout{display:grid;grid-template-columns:1fr}.back-link,.lead-prev{border:0;padding:0;background:none;color:#bfcde2;font-size:11px;font-weight:700;margin:0 0 10px}.back-link:hover,.lead-prev:hover{color:#fff}.lead-prev{margin:8px 0 0}.lead-note{font-size:11px;line-height:1.3;color:#b9c6db;margin:8px 0 0}.lead-card .error{min-height:0;margin:4px 0 0}.lead-card .actions{padding-top:10px}
    @media(max-height:730px){.top,.bottom{padding-top:12px;padding-bottom:12px}.hero{font-size:clamp(42px,10vw,58px)}.signal{height:27vh;margin:0 auto 8px}.core{width:38%}.sub{margin-top:12px}.cardpad{padding:15px}.preview{height:30vh}.body{margin-bottom:9px}.field{margin-bottom:7px}.field input,.field select{min-height:40px}.primary,.secondary{min-height:46px}.actions{padding-top:9px}.stack{gap:5px;margin-top:10px}.stack-row{padding:8px}}
    @media(max-width:350px){.top,.bottom{padding-left:14px;padding-right:14px}.event-label{display:none}.section-title{font-size:30px}.stack-row{gap:8px}.stack-row b{min-width:72px}}
    @media(max-height:620px){.top,.bottom{padding-top:8px;padding-bottom:8px}.card:has(#leadForm){padding:11px 14px}.card:has(#leadForm) .back-link{font-size:9px;margin-bottom:6px}.card:has(#leadForm) .lead-prev{font-size:9px;margin:5px 0 0}.card:has(#leadForm) .lead-step-count{font-size:9px}.card:has(#leadForm) .eyebrow{margin-bottom:5px;font-size:9px}.card:has(#leadForm) .section-title{font-size:26px;margin-bottom:7px}.card:has(#leadForm) .field{gap:3px;margin-bottom:5px}.card:has(#leadForm) .field label{font-size:9px}.card:has(#leadForm) input,.card:has(#leadForm) select{min-height:34px;padding:5px 8px;font-size:12px}.card:has(#leadForm) .check{font-size:10px;line-height:1.2;margin:5px 0}.card:has(#leadForm) .check input{width:14px;height:14px}.card:has(#leadForm) .lead-note{font-size:9px;line-height:1.2;margin-top:4px}.card:has(#leadForm) .error{font-size:10px;margin-top:2px}.card:has(#leadForm) .actions{padding-top:3px}.card:has(#leadForm) .primary{min-height:42px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="app">
    <header class="top"><a class="brand" href="signal-stadium-wall.html" aria-label="Signal Stadium arena"><img src="assets/twilio-bug-official.png" alt="Twilio"><span>SIGNAL STADIUM</span></a><div class="event-label" id="eventName">SIGNAL STADIUM</div></header>
    <main><div class="screen" id="screen" aria-live="polite"></div></main>
    <footer class="bottom"><span>Demo · data stays here</span><a href="signal-stadium-wall.html">Arena ↗</a></footer>
  </div>
  <script src="config-store.js"></script>
  <script src="metrics-store.js"></script>
  <script src="leads-store.js"></script>
  <script src="signal-stadium-player.js"></script>
</body>
</html>
