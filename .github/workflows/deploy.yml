name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: live-scavenger-hunt-deploy-prod
  cancel-in-progress: false

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACR_REPO: live-scavenger-hunt
  ACA_NAME: ${{ vars.ACA_NAME }}
  ACA_RESOURCE_GROUP: ${{ vars.ACA_RESOURCE_GROUP }}

jobs:
  ci:
    # The reusable test workflow receives no Azure or application secrets.
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    if: ${{ needs.ci.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve immutable image tag
        id: image
        env:
          SHA: ${{ github.sha }}
        run: |
          test -n "$ACR_NAME" || { echo '::error::ACR_NAME is unset'; exit 1; }
          echo "uri=${ACR_NAME}.azurecr.io/${ACR_REPO}:${SHA}" >> "$GITHUB_OUTPUT"
      - name: Azure login through GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"
      - uses: docker/setup-buildx-action@v4
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE: ${{ needs.build-and-push.outputs.image }}
      # An unset variable leaves the live setting untouched. Provisioning starts
      # at 0; after verifying the first Blob backup, set this repo variable to 1.
      LITESTREAM_REQUIRE_REPLICA: ${{ vars.LITESTREAM_REQUIRE_REPLICA }}
      # Both are optional. When set, the stopped-writer rollout adds the client
      # ID and an ACA secret reference to the replacement revision only.
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      # Explicit emergency off switch; an unset value preserves the live state.
      GOOGLE_AUTH_DISABLE: ${{ vars.GOOGLE_AUTH_DISABLE }}
      # Explicit live/rehearsal Video switch. Blank preserves the ACA setting.
      # Live activation requires all four Twilio secrets; the rollout validates
      # them before it stops the current SQLite writer.
      TWILIO_VIDEO_MODE: ${{ vars.TWILIO_VIDEO_MODE }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_API_KEY_SID: ${{ secrets.TWILIO_API_KEY_SID }}
      TWILIO_API_KEY_SECRET: ${{ secrets.TWILIO_API_KEY_SECRET }}
      # Also deployable alone for signed SMS/WhatsApp ballot webhooks.
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      # Optional server integrations. Blank values preserve the deployed ACA
      # configuration; the explicit SendGrid off switch below is the exception.
      # Only the deploy job receives application credentials.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_VISION_MODEL: ${{ vars.OPENAI_VISION_MODEL }}
      SEGMENT_WRITE_KEY: ${{ secrets.SEGMENT_WRITE_KEY }}
      # Guide email is off unless explicitly enabled with a verified sender.
      # A zero removes the candidate revision's Mail Send credentials.
      SENDGRID_EMAIL_ENABLED: ${{ vars.SENDGRID_EMAIL_ENABLED }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      SENDGRID_EVENT_WEBHOOK_PUBLIC_KEY: ${{ secrets.SENDGRID_EVENT_WEBHOOK_PUBLIC_KEY }}
      SENDGRID_FROM_EMAIL: ${{ vars.SENDGRID_FROM_EMAIL }}
      SENDGRID_REGION: ${{ vars.SENDGRID_REGION }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Azure login through GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Stop old writer and deploy one verified revision
        run: bash scripts/deploy-azure.sh "$IMAGE"
