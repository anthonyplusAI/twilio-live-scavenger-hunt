name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

# This workflow is also called by deploy.yml. Keep permissions and concurrency
# on the caller, so a read-only pull request can run the same validation gate.
jobs:
  checks:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check deployment shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

  container-build:
    name: Container build and startup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the production image
        run: docker build --tag live-scavenger-hunt:ci .
      - name: Check the bundled Litestream binary
        run: docker run --rm live-scavenger-hunt:ci litestream version
      - name: Smoke the container without cloud credentials
        run: |
          BOOTSTRAP_ADMIN_PASSWORD="$(openssl rand -hex 32)"
          docker run --detach --name live-scavenger-hunt-ci \
            --publish 127.0.0.1:18080:8080 \
            --env REHEARSAL_MODE=on \
            --env BOOTSTRAP_ADMIN_PASSWORD="$BOOTSTRAP_ADMIN_PASSWORD" \
            live-scavenger-hunt:ci
          trap 'docker rm --force live-scavenger-hunt-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health >/dev/null; then
              echo "Container health passed after attempt $attempt."
              exit 0
            fi
            sleep 2
          done
          docker logs live-scavenger-hunt-ci
          exit 1

  Validate:
    name: Validate
    needs: [checks, container-build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm required checks passed
        run: |
          echo "Build and test: ${{ needs.checks.result }}"
          echo "Container build: ${{ needs.container-build.result }}"
          if [ "${{ needs.checks.result }}" != "success" ] || \
             [ "${{ needs.container-build.result }}" != "success" ]; then
            echo "::error::One or more required CI jobs did not pass."
            exit 1
          fi
